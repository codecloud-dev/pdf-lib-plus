# 依赖自动更新（按月分组，只收 minor/patch；major 需人工评估）
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 这三个包被 package.json 的 resolutions 固定在 TypeScript 3.9 能解析的
      # 版本上。自动升级会让 `yarn typecheck` 直接崩在 node_modules 的类型文件里，
      # 所以只能随工具链升级一起人工评估，不收自动 PR。
      - dependency-name: "@types/node"
      - dependency-name: "@types/babel__traverse"
      - dependency-name: "@types/prettier"
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels: ["dependencies", "ci"]
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
