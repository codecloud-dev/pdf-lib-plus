# 依赖自动更新（按月分组，只收 minor/patch；major 需人工评估）
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 这三个包被 package.json 的 resolutions 固定在 TypeScript 3.9 能解析的
      # 版本上。自动升级会让 `yarn typecheck` 直接崩在 node_modules 的类型文件里，
      # 所以只能随工具链升级一起人工评估，不收自动 PR。
      - dependency-name: "@types/node"
      - dependency-name: "@types/babel__traverse"
      - dependency-name: "@types/prettier"
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # downlevel-dts 0.11.x 依赖 typescript next（nightly 7.x），
      # 与本仓固定的 TypeScript 3.9 构建链不兼容（PR #4 真实 CI 失败：
      # ts.createProgram is not a function）。0.x 升级被判成 minor，
      # 所以要按依赖名单独挡住，不能只靠 semver-major 过滤。
      - dependency-name: "downlevel-dts"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels: ["dependencies", "ci"]
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

    ignore:
      # actions 大版本升级会连带改 runner 镜像、Node/Python 默认版本与
      # 权限模型，必须由人工跑一遍完整 CI 再决定，不收自动 PR。
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]